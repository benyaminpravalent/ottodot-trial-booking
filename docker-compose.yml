services:
  postgres:
    image: postgres:16-alpine
    container_name: ottodot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ottodot
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ottodot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
